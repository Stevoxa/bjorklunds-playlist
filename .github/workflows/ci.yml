name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # postinstall laddar ner Chromium; systembiblioteken installeras separat.
      - run: npm ci
      - run: npx playwright install-deps chromium
      - name: Röktest (index.html + service worker)
        run: npm test
      - name: UI-flöde steg 2–3
        run: npm run test:flow
      - name: Playwright (inkl. mockat Spotify-flöde)
        run: npx playwright test
      - name: Ladda upp skärmbilder
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            docs/screenshots/
            artifacts/
          if-no-files-found: ignore
